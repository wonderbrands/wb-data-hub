id: ml_oficiales_shipping_labels_pipeline
namespace: wonderbrands.shipping_labels.mercadolibre
description: "Pipeline completo ML (SOMOS-REYES OFICIALES, seller 160190870): extrae guías de ML, clasifica SLA y publica en Odoo"

variables:
  repo_url: "https://github.com/wonderbrands/wb-data-hub.git"
  branch: "main"
  ml_seller_id: "160190870"
  odoo_url: "https://somosreyes.odoo.com"
  odoo_db: "wonderbrands2026-main-28990431"
  db_user: "kestra_bot"
  db_name: "tools"
  db1_host: "wonderbrands1.cuwd36ifbz5t.us-east-1.rds.amazonaws.com"

tasks:
  - id: working_env_ml_oficiales
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:

      - id: clone_repo
        type: io.kestra.plugin.git.Clone
        url: "{{ vars.repo_url }}"
        branch: "{{ vars.branch }}"
        username: "{{ secret('GIT_USER') }}"
        password: "{{ secret('GIT_TOKEN_WB') }}"

      - id: extract_sla_orders
        type: io.kestra.plugin.scripts.shell.Commands
        containerImage: wonderbrands-python:v1
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          pullPolicy: NEVER
        retry:
          type: constant
          interval: PT1M
          maxAttempts: 3
        env:
          DB_HOST: "{{ vars.db1_host }}"
          DB_USER: "{{ vars.db_user }}"
          DB_PASSWORD: "{{ secret('DB_PASSWORD_KESTRA') }}"
          DB_NAME: "{{ vars.db_name }}"
          ML_SELLER_ID: "{{ vars.ml_seller_id }}"
        commands:
          - python processes/wonderbrands/shipping_labels/mercadolibre/ml_mix_db_api_sla_orders.py

      - id: inject_labels_odoo
        type: io.kestra.plugin.scripts.shell.Commands
        containerImage: wonderbrands-python:v1
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          pullPolicy: NEVER
        retry:
          type: constant
          interval: PT1M
          maxAttempts: 3
        env:
          ODOO_URL: "{{ vars.odoo_url }}"
          ODOO_DB: "{{ vars.odoo_db }}"
          ODOO_USER: "{{ secret('odoo_user_dataV18') }}"
          ODOO_PASSWORD: "{{ secret('odoo_password_dataV18') }}"
          DB_HOST: "{{ vars.db1_host }}"
          DB_USER: "{{ vars.db_user }}"
          DB_PASSWORD: "{{ secret('DB_PASSWORD_KESTRA') }}"
          DB_NAME: "{{ vars.db_name }}"
          ML_SELLER_ID: "{{ vars.ml_seller_id }}"
        commands:
          - python processes/wonderbrands/shipping_labels/mercadolibre/ml_odoo_injection_labels.py

triggers:
  - id: madrugada_y_noche          # 2:10, 4:10, 6:10 AM y 5:10, 6:10, 8:10, 10:10 PM CDMX
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "10 0,2,4,8,10,12,23 * * *"

  - id: hora_pico_640               # 6:40 AM CDMX
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "40 12 * * *"

  - id: horas_pico_matutinas        # 7:10 AM–1:40 PM CDMX, cada 30 min (minutos 10 y 40)
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "10,40 13-19 * * *"

  - id: cierre_pico_1400            # 2:25 PM CDMX
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "25 20 * * *"

errors:
  - id: slack_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "🚨 *Fallo crítico en el pipeline de guías de MercadoLibre OFICIALES (160190870)* 🚨\n*Flujo:* {{ flow.id }}\n*ID de ejecución:* {{ execution.id }}\n*Fecha:* {{ execution.startDate }}"
      }
