id: odoo_facturacion_1a1_mkp_pipeline
namespace: wonderbrands.financial.odoo
description: "Pipeline de facturación 1 a 1 para órdenes de marketplaces en Odoo"

# =====================================================================
# EXCLUSION MUTUA
# ---------------------------------------------------------------------
# behavior: FAIL  -> la ejecución nueva falla de inmediato y dispara la
#                    alerta de Slack. No QUEUE, porque encolar
#                    una corrida solo pospone la colisión.
# =====================================================================
concurrency:
  limit: 1
  behavior: FAIL

pluginDefaults:
  - type: io.kestra.plugin.scripts.shell.Commands
    values:
      containerImage: wonderbrands-python:v1
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
        pullPolicy: NEVER
        memory:
          memory: "512MB"
          memorySwap: "2048MB"
        cpus: 1.5
      # =================================================================
      # CAMBIO CRITICO #2 — SE ELIMINA EL RETRY AUTOMATICO
      # -----------------------------------------------------------------
      # Antes: retry {type: constant, interval: PT1M, maxAttempt: 3}
      # Reintentar a ciegas un script de facturación relanza TODO el
      # proceso: si murió después de timbrar, la corrida nueva vuelve a
      # recorrer la misma lista. Con las tres capas anidadas que existían
      # (execute_kw x3, main() x3, Kestra x3) el peor caso eran 27
      # ejecuciones del mismo trabajo.
      # Un fallo ahora es visible y humano, no silencioso y automático.
      # =================================================================

variables:
  repo_url: "https://github.com/wonderbrands/wb-data-hub.git"
  branch: "main"
  odoo_url: "https://somosreyes.odoo.com"
  odoo_db: "wonderbrands2026-main-28990431"
  db_user: "kestra_bot"
  db_name: "finance"
  db_host: "wonderbrands1.cuwd36ifbz5t.us-east-1.rds.amazonaws.com"

tasks:
  - id: working_env_billing
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:

      - id: clone_repo
        type: io.kestra.plugin.git.Clone
        url: "{{ vars.repo_url }}"
        branch: "{{ vars.branch }}"
        username: "{{ secret('GIT_USER') }}"
        password: "{{ secret('GIT_TOKEN_WB') }}"

      - id: execute_invoicing_1a1
        type: io.kestra.plugin.scripts.shell.Commands
        timeout: PT8H
        env:
          ODOO_URL: "{{ vars.odoo_url }}"
          ODOO_DB: "{{ vars.odoo_db }}"
          ODOO_USER: "{{ secret('odoo_user_dataV18') }}"
          ODOO_PASSWORD: "{{ secret('odoo_password_dataV18') }}"
          DB_HOST: "{{ vars.db_host }}"
          DB_USER: "{{ vars.db_user }}"
          DB_PASSWORD: "{{ secret('DB_PASSWORD_KESTRA') }}"
          DB_NAME: "{{ vars.db_name }}"
          SLACK_WEBHOOK: "{{ secret('SLACK_WEBHOOK') }}"
          KESTRA_EXECUTION_ID: "{{ execution.id }}"
        commands:
          - python processes/wonderbrands/financial/billing_processes/odoo/facturacion_automatica_1a1.py

triggers:
  - id: ejecucion_diaria_noche       # 19:30 CDMX
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 19 * * *"
    timezone: America/Mexico_City
    # =================================================================
    # Con el default (ALL_MISSED), un reinicio del executor dispara en
    # ráfaga todos los schedules perdidos: varias ejecuciones casi
    # simultáneas del mismo flujo.
    # =================================================================
    recoverMissedSchedules: LAST

  - id: ejecucion_madrugada          # 04:30 CDMX
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 04 * * *"
    timezone: America/Mexico_City
    recoverMissedSchedules: LAST

errors:
  - id: slack_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "🚨 *Fallo en el pipeline de Facturación 1 a 1 (Odoo)* 🚨\n*Flujo:* {{ flow.id }}\n*ID de ejecución:* {{ execution.id }}\n*Fecha:* {{ execution.startDate }}\n_Si la causa es CONCURRENCY_LIMIT, otra ejecución sigue activa: NO relanzar a mano._"
      }