id: ml_billing_process_flow
namespace: wonderbrands.financial.mercadolibre
description: "Pipeline Facturación: Extrae XMLs de ML (01) y los inyecta en Odoo en lotes (02)"

# Configuración por defecto para todas las tareas Commands de este flujo
pluginDefaults:
  - type: io.kestra.plugin.scripts.shell.Commands
    values:
      containerImage: wonderbrands-python:v1
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
        pullPolicy: NEVER


concurrency:
  limit: 1
  behavior: CANCEL

variables:
  repo_url: "https://github.com/wonderbrands/wb-data-hub.git"
  branch: "mercadolibre_invoice_flows"
  odoo_url: "https://somosreyes.odoo.com"
  odoo_db: "wonderbrands2026-main-28990431"
  db_user: "kestra_bot"
  db_name: "finance"
  db1_host: "wonderbrands1.cuwd36ifbz5t.us-east-1.rds.amazonaws.com"

tasks:
  - id: working_env_billing
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      
      - id: clone_repo
        type: io.kestra.plugin.git.Clone
        url: "{{ vars.repo_url }}"
        branch: "{{ vars.branch }}"
        username: "{{ secret('GIT_USER') }}"
        password: "{{ secret('GIT_TOKEN_WB') }}"

      # ── PASO 01: Extracción de XMLs de Mercado Libre a BD ──
      - id: run_miner_ml_billing
        type: io.kestra.plugin.scripts.shell.Commands
        env:
          DB_HOST: "{{ vars.db1_host }}"
          DB_USER: "{{ vars.db_user }}"
          DB_PASSWORD: "{{ secret('DB_PASSWORD_KESTRA') }}"
          DB_NAME: "{{ vars.db_name }}"
        commands:
          - python processes/wonderbrands/financial/billing_processes/mercadolibre/01_miner_ml_billing.py

      # ── PASO 02: Inyección de Facturas a Odoo (Lotes controlados) ──
      - id: run_loader_ml_billing
        type: io.kestra.plugin.scripts.shell.Commands
        env:
          ODOO_URL: "{{ vars.odoo_url }}" 
          ODOO_DB: "{{ vars.odoo_db }}"
          ODOO_USER: "{{ secret('odoo_user_dataV18') }}"
          ODOO_PASSWORD: "{{ secret('odoo_password_dataV18') }}"
          DB_HOST: "{{ vars.db1_host }}"
          DB_USER: "{{ vars.db_user }}"
          DB_PASSWORD: "{{ secret('DB_PASSWORD_KESTRA') }}"
          DB_NAME: "{{ vars.db_name }}"
        commands:
          - python processes/wonderbrands/financial/billing_processes/mercadolibre/02_loader_ml_billing.py

triggers:
  # Distribución de carga: Se ejecuta cada 6 horas UTC
  - id: micro_lotes_cada_6_horas 
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0,6,12,18 * * *"

errors:
  - id: slack_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "🚨 *¡Fallo en Pipeline de Facturación ML (Scripts 01-02)!* 🚨\n*Flujo:* `{{ flow.id }}`\n*ID Ejecución:* `{{ execution.id }}`\n*Tarea Fallida:* `{{ execution.tasksRun | filter(t => t.state.current == 'FAILED') | map(t => t.taskId) | first }}`\n*Fecha:* `{{ execution.startDate }}`"
      }