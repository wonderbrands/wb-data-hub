id: ml_oficiales_payments_flow
namespace: wonderbrands.financial.mercadolibre
description: "Pipeline Pagos ML OFICIALES (SOMOS-REYES OFICIALES, seller 160190870): Extrae cobros liberados de MP (03) y los concilia en Odoo (04). Arranca al terminar la facturación de Oficiales."

concurrency:
  limit: 1
  behavior: CANCEL

variables:
  repo_url: "https://github.com/wonderbrands/wb-data-hub.git"
  branch: "main"
  # marketplace (MERCADO_LIBRE_OFICIALES) y diario de cobros ('MPO', cuenta 102.02.009)
  # se derivan del seller en ml_stores.py
  ml_seller_id: "160190870"
  odoo_url: "https://somosreyes.odoo.com"
  odoo_db: "wonderbrands2026-main-28990431"
  db_user: "kestra_bot"
  db_name: "finance"
  db1_host: "wonderbrands1.cuwd36ifbz5t.us-east-1.rds.amazonaws.com"

tasks:
  - id: working_env_payments_oficiales
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:

      - id: clone_repo
        type: io.kestra.plugin.git.Clone
        url: "{{ vars.repo_url }}"
        branch: "{{ vars.branch }}"
        username: "{{ secret('GIT_USER') }}"
        password: "{{ secret('GIT_TOKEN_WB') }}"

      # ── PASO 03: Extracción y validación de cobros liberados (MP Oficiales) ──
      - id: run_miner_ml_payments
        type: io.kestra.plugin.scripts.shell.Commands
        containerImage: wonderbrands-python:v1
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          pullPolicy: NEVER
        env:
          DB_HOST: "{{ vars.db1_host }}"
          DB_USER: "{{ vars.db_user }}"
          DB_PASSWORD: "{{ secret('DB_PASSWORD_KESTRA') }}"
          DB_NAME: "{{ vars.db_name }}"
          # El script siempre lee MERCADO_PAGO_TOKEN; aquí se le mapea el secreto de Oficiales
          MERCADO_PAGO_TOKEN: "{{ secret('MERCADO_PAGO_TOKEN_OFICIALES') }}"
          ML_SELLER_ID: "{{ vars.ml_seller_id }}"
        commands:
          - python processes/wonderbrands/financial/billing_processes/mercadolibre/03_miner_ml_payments.py

      # ── PASO 04: Aplicación y conciliación nativa de cobros en Odoo (diario MPO) ──
      - id: run_loader_ml_payments
        type: io.kestra.plugin.scripts.shell.Commands
        containerImage: wonderbrands-python:v1
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          pullPolicy: NEVER
        env:
          ODOO_URL: "{{ vars.odoo_url }}"
          ODOO_DB: "{{ vars.odoo_db }}"
          ODOO_USER: "{{ secret('odoo_user_dataV18') }}"
          ODOO_PASSWORD: "{{ secret('odoo_password_dataV18') }}"
          DB_HOST: "{{ vars.db1_host }}"
          DB_USER: "{{ vars.db_user }}"
          DB_PASSWORD: "{{ secret('DB_PASSWORD_KESTRA') }}"
          DB_NAME: "{{ vars.db_name }}"
          ML_SELLER_ID: "{{ vars.ml_seller_id }}"
        commands:
          - python processes/wonderbrands/financial/billing_processes/mercadolibre/04_loader_ml_payments.py

triggers:
  # Se ejecuta automáticamente en cuanto termina la Facturación ML Oficiales
  - id: listen_to_billing_flow
    type: io.kestra.plugin.core.trigger.Flow
    states:
      - SUCCESS
      - WARNING
    dependsOn:
      - namespace: wonderbrands.financial.mercadolibre
        flowId: ml_oficiales_billing_process_flow

  # DISPARADOR DE RESPALDO: barrido a las 5:30 AM UTC (11:30 PM CDMX), 30 min después
  # del barrido de ml_payments_flow, por si algún cobro se liberó tarde en Mercado Pago.
  - id: barrido_nocturno_pagos
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 5 * * *"

errors:
  - id: slack_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "🚨 *¡Fallo en Pipeline de Pagos ML OFICIALES (160190870) (Scripts 03-04)!* 🚨\n*Flujo:* `{{ flow.id }}`\n*ID Ejecución:* `{{ execution.id }}`\n*Tarea Fallida:* `{{ execution.tasksRun | filter(t => t.state.current == 'FAILED') | map(t => t.taskId) | first }}`\n*Fecha:* `{{ execution.startDate }}`"
      }
